[package]
name = "llll-desktop"
version = "0.1.0"
description = "Native macOS client for L4"
authors = ["L4 contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "llll_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-http = "2.6.0"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
