[package]
name = "llll-desktop"
version = "0.1.0"
description = "macOS app for L4 Servers"
authors = ["Inchi LLC"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "llll_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# `unstable`: one window holding two webviews, the Server and the Server rail.
tauri = { version = "2.11.5", features = ["unstable"] }
tauri-plugin-http = "2.6.0"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
