version: 2
updates:
  # pnpm's root workspace and lockfile cover apps/* and packages/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Ho_Chi_Minh
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      tooling-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    # Major versions remain individual PRs. Security updates bypass cooldown
    # and the version-update PR limit; no automerge is configured.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directories:
      - /self-host
      - /packages/agent-runtime
      - /packages/agent-runner
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: docker-compose
    directories:
      - /self-host
      - /self-host/coolify
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # Native publication is frozen; keep security updates without routine bumps.
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
