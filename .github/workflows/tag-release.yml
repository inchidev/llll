name: Tag release

# A release is explicit and only tags a main commit with successful CI.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
            --jq '.workflow_runs | any(.head_sha == env.GITHUB_SHA and .conclusion == "success")' > "$RUNNER_TEMP/ci-ready"
          test "$(cat "$RUNNER_TEMP/ci-ready")" = true

      - name: Require successful production Build for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=Workers%20Builds%3A%20llll&per_page=100" \
            --jq '.check_runs | any(.head_sha == env.GITHUB_SHA and .app.id == 85455 and .conclusion == "success")' > "$RUNNER_TEMP/web-ready"
          test "$(cat "$RUNNER_TEMP/web-ready")" = true

      - name: Tag and dispatch publishers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          test -f "docs/release-notes/${tag}.md"
          node -e "if(require('./package.json').version !== require('./packages/deployment-core/package.json').version) process.exit(1)"
          remote_tags="$(git ls-remote --tags origin "refs/tags/${tag}")"
          if [ -n "$remote_tags" ]; then
            echo "Release tag already exists; use an exact-tag recovery workflow for an unpublished draft."
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
          gh workflow run publish-installer-release.yml --ref main -f tag="$tag"
          gh workflow run publish-image.yml --ref main -f tag="$tag"
