name: Deploy llll.gg site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "shared/**"
      - "scripts/build-site.mjs"
      - "scripts/site-cloudflare.mjs"
      - ".github/workflows/deploy-site.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "apps/site/**"
      - "shared/**"
      - "scripts/build-site.mjs"
      - "scripts/site-cloudflare.mjs"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm site:build

      # Push to main: migrate portal D1, then deploy worker `llll` (llll.gg).
      # This is the git-push deploy: no dashboard "Connect to Git" needed.
      - name: Deploy production (llll.gg)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: pnpm site:deploy

      # PRs get an isolated Preview named pr-<N> on worker `llll`.
      # Bindings come from the `previews` block in apps/site/wrangler.jsonc
      # (shared staging DB llll-portal-staging for all previews; a branch
      # that needs isolation overrides previews.d1_databases on itself).
      # Public URL once the wildcard custom domain is attached in the
      # dashboard (Workers & Pages > llll > Previews > custom domain
      # *.dev.llll.gg): https://pr-<N>.dev.llll.gg
      - name: Deploy PR preview
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          out="$(pnpm site:preview pr-${{ github.event.pull_request.number }})"
          echo "$out"
          echo "url=$(echo "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).url||'')}catch{}})") " >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "Site preview: ${{ steps.preview.outputs.url }} (custom domain once attached: https://pr-${{ github.event.pull_request.number }}.dev.llll.gg)" --edit-last || \
          gh pr comment "${{ github.event.pull_request.number }}" --body "Site preview: ${{ steps.preview.outputs.url }} (custom domain once attached: https://pr-${{ github.event.pull_request.number }}.dev.llll.gg)"

  # PR closed: delete its Preview. Staging D1/R2/KV are shared and stay.
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm site:preview-delete pr-${{ github.event.pull_request.number }}
