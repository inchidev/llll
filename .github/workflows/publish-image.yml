name: Publish self-host image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, including the leading v
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify release and reject published replacements
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = false ]; then echo "Published releases are immutable."; exit 1; fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: self-host/Dockerfile
          load: true
          platforms: linux/amd64
          tags: llll:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=llll-runtime
          cache-to: type=gha,mode=max,scope=llll-runtime

      - name: Export the portable image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker save "llll:${VERSION}" | gzip -1 > "$RUNNER_TEMP/llll-runtime-linux-amd64.tar.gz"

      # The installer owns the draft's initial assets and checksum file. Wait
      # for that publisher to finish before adding the image and its checksum.
      - name: Wait for the installer publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-installer-release.yml/runs?head_sha=${GITHUB_SHA}&per_page=20" --jq '.workflow_runs | sort_by(.created_at) | last | .conclusion // "pending"')"
            if [ "$state" = success ]; then exit 0; fi
            if [ "$state" != pending ]; then echo "Installer publisher: $state"; exit 1; fi
            sleep 10
          done
          echo "Installer publisher did not finish."; exit 1

      - name: Add image and checksums to the unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/installer-checksums"
          cd "$RUNNER_TEMP"
          awk '$2 != "llll-runtime-linux-amd64.tar.gz"' installer-checksums/SHA256SUMS > SHA256SUMS
          sha256sum llll-runtime-linux-amd64.tar.gz >> SHA256SUMS
          LC_ALL=C sort -k2 SHA256SUMS -o SHA256SUMS
          gh release upload "$RELEASE_TAG" llll-runtime-linux-amd64.tar.gz SHA256SUMS --clobber
          echo "Portable image added to the draft. Verify and publish the release."
