name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: release-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: node scripts/check-release-policy.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, typecheck:site, test, build, build:site, migrations, integration]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        if: matrix.check != 'test' && matrix.check != 'migrations' && matrix.check != 'integration'
        run: pnpm run ${{ matrix.check }}

      - name: Validate migration history
        if: matrix.check == 'migrations'
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          pnpm model:check
          pnpm db:migrations:check

      - name: Apply all migrations to a fresh local D1 database
        if: matrix.check == 'migrations'
        run: |
          migration_state="$(mktemp -d)"
          pnpm exec wrangler d1 migrations apply DB --local --persist-to "$migration_state"

      - name: Check client types
        if: matrix.check == 'typecheck'
        run: >-
          pnpm --filter @llll/mobile typecheck &&
          pnpm --filter @llll/desktop typecheck &&
          pnpm --filter @llll/extension typecheck

      # Keep test output in the log: the GitHub annotations reporter crashes
      # the runner with a Unicode EncoderFallbackException on this suite.
      - name: Run test
        if: matrix.check == 'test'
        run: |
          pnpm exec nuxt prepare apps/site
          pnpm test --reporter=default

      - name: Verify the independent Server runtimes
        if: matrix.check == 'integration'
        run: |
          pnpm build:site
          pnpm build:deployment
          pnpm test:server
          node scripts/test-web.mjs

  local-stack:
    name: local-stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start an isolated standalone development Server
        run: |
          node scripts/local-stack.mjs dev --no-shell --port 38080 --frontend-port 38081 --shell-port 38082 > "$RUNNER_TEMP/local-stack.log" 2>&1 &
          echo "LLLL_DEV_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 180); do
            if curl -fsS http://localhost:38080/.well-known/llll >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$!" 2>/dev/null; then cat "$RUNNER_TEMP/local-stack.log"; exit 1; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/local-stack.log"
          exit 1
      - name: Verify source reload and standalone transport with independent storage
        run: pnpm test:stack
      - name: Show development startup logs
        if: failure()
        run: cat "$RUNNER_TEMP/local-stack.log" || true
      - name: Stop development processes and retain no running services
        if: always()
        run: |
          if [ -n "${LLLL_DEV_PID:-}" ]; then
            kill -TERM "$LLLL_DEV_PID" 2>/dev/null || true
            for attempt in $(seq 1 30); do
              if ! kill -0 "$LLLL_DEV_PID" 2>/dev/null; then break; fi
              sleep 1
            done
          fi
          if [ -f .deployment/dev-stack/.env ]; then node scripts/local-stack.mjs down; fi

  self-host:
    name: self-host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Write a local env file
        working-directory: self-host
        run: |
          umask 077
          auth="$(openssl rand -hex 32)"
          token="$(openssl rand -hex 32)"
          secret="$(openssl rand -hex 24)"
          cat > .env <<EOF
          PUBLIC_ORIGIN=http://127.0.0.1:8080
          AUTH_SECRET=${auth}
          ADMIN_EMAIL=owner@example.com
          SETUP_TOKEN=${token}
           APP_NAME=L4
          RUSTFS_ACCESS_KEY=llll
          RUSTFS_SECRET_KEY=${secret}
          RUSTFS_BUCKET=cells
          AWS_REGION=us-east-1
          EOF

      - name: Build the image and require health 200
        run: bash self-host/smoke.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Install the prebuilt Server and verify a cold restore
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true "$(command -v node)" scripts/test-vps-live.mjs

      - name: Show Compose logs
        if: failure()
        run: |
          docker compose -f self-host/docker-compose.yml logs --no-color

      - name: Stop validation containers
        if: always()
        run: |
          docker compose -f self-host/docker-compose.yml down -v

  vps-installer:
    name: vps-installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check shell diagnostics
        run: docker run --rm -v "$PWD:/repo:ro" koalaman/shellcheck:v0.11.0 --severity=warning /repo/self-host/install/install.sh
      - name: Exercise installer transactions in a disposable Linux container
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo node:24.21.0-bookworm-slim bash -c '
            apt-get update -qq &&
            apt-get install -y -qq curl jq openssl util-linux iproute2 >/dev/null &&
            node scripts/test-vps-installer.mjs'
