name: Pi runtime
on:
  pull_request:
    branches: [main]
    paths: ['packages/agent-runtime/**', 'packages/agent-runner/**', 'scripts/test-pi-runtime.mjs', 'pnpm-lock.yaml', '.github/workflows/agent-runtime.yml']
permissions:
  contents: read
jobs:
  isolated-pi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @llll/agent-runtime test
      - run: docker build -t llll-agent:pi-1.3.0 -f packages/agent-runtime/Dockerfile .
      - run: docker build -t llll-agent-runner:local packages/agent-runner
      - run: node scripts/test-pi-runtime.mjs
