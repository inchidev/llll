name: Pi runtime
on:
  pull_request:
    branches: [main]
    paths: ['packages/agent-runtime/**', 'packages/agent-runner/**', 'scripts/test-pi-runtime.mjs', 'pnpm-lock.yaml', '.github/workflows/agent-runtime.yml']
permissions:
  contents: read
jobs:
  isolated-pi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @llll/agent-runtime test
      - run: docker build -t llll-agent:pi-1.3.0 -f packages/agent-runtime/Dockerfile .
      - run: docker build -t llll-agent-runner:local packages/agent-runner
      - run: node scripts/test-pi-runtime.mjs
