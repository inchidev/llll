name: Pi runtime
on:
  pull_request:
    branches: [main]
    paths: ['packages/agent-runtime/**', 'packages/agent-runner/**', 'packages/compute-node/**', 'scripts/test-pi-runtime.mjs', 'scripts/test-factory-workspace.mjs', 'pnpm-lock.yaml', '.github/workflows/agent-runtime.yml']
permissions:
  contents: read
jobs:
  isolated-pi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @llll/agent-runtime test
      - run: pnpm --filter @llll/compute-node test
      - run: docker build -t l4-workspace:test -f packages/compute-node/Dockerfile.workspace .
      - run: node scripts/test-factory-workspace.mjs
      - name: Build the fixed root idle supervisor for Cloudflare
        run: docker build --build-arg WORKSPACE_IMAGE=l4-workspace:test -t l4-workspace:cloud-test -f packages/compute-node/Dockerfile.cloud .
      - name: Verify code checkpoints, replacement restore and process cleanup
        run: node --test packages/compute-node/test/cloud-state.test.mjs
        env:
          LLLL_FACTORY_CLOUD_TEST_IMAGE: l4-workspace:cloud-test
          LLLL_FACTORY_CLOUD_LIFECYCLE_IMAGE: l4-workspace:cloud-test
      - run: docker build -t llll-agent:pi-1.3.0 -f packages/agent-runtime/Dockerfile .
      - run: docker build -t llll-agent-runner:local packages/agent-runner
      - run: node scripts/test-pi-runtime.mjs
