# Optional local Docker execution. Run with the standalone Server's base Compose.
# Only the trusted Runner receives the Docker socket. Agent containers join the
# internal network, which has no public internet route.
services:
  llll:
    environment:
      AGENT_RUNNER_URL: http://agent-runner:8081
      AGENT_RUNNER_TOKEN: ${LLLL_RUNNER_TOKEN:?set a separate 32+ character Runner token}
      AGENT_CALLBACK_ORIGIN: http://llll:8080
    networks:
      default:
      agents:
        aliases: [llll]
  agent-runner:
    image: ${LLLL_AGENT_RUNNER_IMAGE:?set the pinned Runner image}
    restart: unless-stopped
    environment:
      LLLL_RUNNER_TOKEN: ${LLLL_RUNNER_TOKEN:?set LLLL_RUNNER_TOKEN}
      LLLL_SERVER_ID: ${LLLL_SERVER_ID:?set this Server UUID}
      LLLL_AGENT_NETWORK: ${LLLL_PROJECT:-llll}-agents
      LLLL_AGENT_IMAGE: ${LLLL_AGENT_IMAGE:?set the pinned Pi runtime image}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [agents]
networks:
  agents:
    name: ${LLLL_PROJECT:-llll}-agents
    internal: true
